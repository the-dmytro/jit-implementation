[project]
name = "jit-implementation"
version = "0.2.0"
description = "JIT Implementation: Code That Writes Itself"
authors = [{ name = "Jiri Klimes", email = "jiriklimes920@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
keywords = ["jit", "llm", "ai", "code-generation"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=3.57.0,<4.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "rich>=15.0.0,<16.0.0",
    "ruff>=0.17.0,<0.18.0",
]

[project.optional-dependencies]
examples = ["pygame>=2.6.1,<3.0.0"]

[project.urls]
Repository = "https://github.com/the-dmytro/jit-implementation"
PyPI = "https://pypi.org/project/jit-implementation/"

[tool.poetry]
packages = [{ include = "jit_implementation" }]
include = [{ path = "jit_implementation/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
